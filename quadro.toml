# Fonte de verdade do quadro do TCC_SDCAC.
#
# Este arquivo se edita à mão. A página `docs/quadro.md` é **gerada** a partir
# dele por `scripts/quadro.py` — editar a página é trabalho que a próxima
# execução apaga.
#
# A regra que faz este arquivo valer a pena
# -----------------------------------------
# Aqui entra **fato**: data, dono, critério, e um estado que só muda quando uma
# pessoa decide que mudou.
#
# Aqui **não** entra estado calculável: "atrasado", "em curso", "vence em 5
# dias", "amanhã". Isso o script calcula contra a data de hoje, toda vez que
# roda.
#
# O motivo não é elegância. Em 26/09/2026 o `docs/cronograma.md` afirmava que a
# Tarefa 02 vencia "amanhã" — o prazo era 24/09, dois dias antes. A frase estava
# certa no dia em que foi escrita, e nunca mais. Contagem regressiva escrita à
# mão envelhece em silêncio; contagem calculada não envelhece nunca.
#
# Como usar
# ---------
#     python scripts/quadro.py              # regenera docs/quadro.md
#     python scripts/quadro.py --conferir   # não escreve; falha se estiver velho
#
# Regras do projeto em AGENTS.md.

