name: Quadro

# Toda manhã: recalcula o quadro contra a data de hoje e abre um Pull Request se
# alguma coisa mudou de situação.
#
# POR QUE ISTO EXISTE
# -------------------
# Em 26/09/2026 o docs/cronograma.md afirmava que a Tarefa 02 vencia "amanhã".
# O prazo era 24/09. A frase estava certa no dia em que foi escrita e nunca mais,
# e ninguém notou por dois dias. Estado escrito à mão envelhece em silêncio.
#
# Este workflow não escreve estado: ele recalcula. O que é fato mora no
# quadro.toml — data, dono, critério, e um estado que só muda quando uma pessoa
# decide que mudou. O que é situação sai do scripts/quadro.py, contra a data de
# hoje.
#
# SEM IA, DE PROPÓSITO
# --------------------
# Diferente do relatorio-semanal.yml, aqui não há texto a escrever: é aritmética
# de data. Nenhum assistente participa, o resultado é determinístico, e quem
# quiser conferir um número roda `python3 scripts/quadro.py` e compara. É o que
# separa prova documentada de texto bonito.
#
# O PR que este workflow abre não toca arquivo protegido — só as três páginas
# geradas — então ele não cai nas 24 h de espera da seção 4 do AGENTS.md.
#
# Ele também não faz merge. O merge na main é do Davi.
#
# Roda sob demanda pelo botão "Run workflow" na aba Actions.
#
# POR QUE A BRANCH É DO DIA, E NÃO UMA SÓ
# ---------------------------------------
# A primeira versão usava uma branch fixa, `claude/chore/quadro-diario`, e
# trazia a `main` para dentro dela a cada execução. Isso funcionou uma vez e
# depois falhou **oito dias seguidos, de 06/10 a 13/10**, sem ninguém perceber —
# workflow agendado que falha não aparece em lugar nenhum.
#
# A causa é estrutural, não um descuido: o repositório usa **squash merge**. O
# commit que a branch empurrou em 29/09 entrou na `main` como um commit
# diferente, com outro SHA, e os PRs seguintes mexeram nas mesmas três páginas
# geradas. A partir daí `git merge origin/main` conflita em `docs/quadro.md`
# todas as vezes, e o passo para — corretamente, e para sempre.
#
# Branch longa e squash merge não se reconciliam. Como **tudo nesta branch é
# gerado**, não há nada nela que valha preservar: a saída certa é nascer da
# `main` a cada dia, em vez de tentar alcançá-la.
#
# Enquanto houver PR do quadro aberto, o workflow continua naquela branch e
# acrescenta commit — assim não acumula um PR por dia. Só quando não há PR
# aberto é que nasce a branch do dia. Nada disso usa `git push --force`, que a
# seção 4 do AGENTS.md proíbe.

on:
  schedule:
    # 11:00 UTC = 08:00 em Brasília, todo dia.
    - cron: "0 11 * * *"
  workflow_dispatch:

# Duas execuções ao mesmo tempo empurrariam a mesma branch e uma perderia.
concurrency:
  group: quadro
  cancel-in-progress: false

jobs:
  quadro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar a branch do quadro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIXO: claude/chore/quadro-
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Já existe PR do quadro aberto? Continua na branch dele, para não
          # abrir um PR por dia. Aí sim traz a main — e um conflito aqui é
          # sinal de verdade, porque significa que alguém mexeu nas páginas
          # geradas enquanto o PR estava aberto.
          aberta="$(gh pr list --state open --json headRefName \
                    -q "[.[] | select(.headRefName | startswith(\"$PREFIXO\"))][0].headRefName")"

          if [ -n "$aberta" ]; then
            echo "PR do quadro aberto em $aberta — continuando nela."
            git fetch origin "$aberta"
            git checkout -B "$aberta" "origin/$aberta"
            git merge --no-edit origin/main
            echo "BRANCH=$aberta" >> "$GITHUB_ENV"
          else
            # Sem PR aberto, a branch antiga é entulho: tudo nela já entrou na
            # main por squash. Nasce uma do dia, a partir da main.
            nova="${PREFIXO}$(date -u +%Y-%m-%d)"
            echo "Nenhum PR do quadro aberto — criando $nova a partir da main."
            git checkout -B "$nova" origin/main
            echo "BRANCH=$nova" >> "$GITHUB_ENV"
          fi

      - name: Recalcular o quadro
        run: |
          python3 scripts/quadro.py
          echo "----- situação de hoje -----"
          sed -n '/^## Resumo/,/^## /p' docs/quadro.md | head -20

      - name: Commitar, se mudou
        id: commit
        run: |
          if git diff --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "Nada mudou de situação hoje. Nenhum commit, nenhum PR."
            exit 0
          fi

          echo "mudou=sim" >> "$GITHUB_OUTPUT"
          git diff --stat
          git add -A

          # "Assistido-por: nenhuma" é a resposta honesta: este commit é
          # aritmética de data, não texto de assistente. O silêncio não
          # distinguiria "não usei" de "esqueci" — AGENTS.md, seção 3.
          git commit -m "chore: atualiza o quadro para $(date -u +%d/%m/%Y)" \
                     -m "Recalculado por scripts/quadro.py contra a data de hoje. O que mudou está no diff das três páginas geradas." \
                     -m "Assistido-por: nenhuma"

          git push origin "$BRANCH"

      - name: Abrir o PR, se ainda não houver um
        if: steps.commit.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          aberto="$(gh pr list --state open --head "$BRANCH" --json number -q '.[0].number')"
          if [ -n "$aberto" ]; then
            echo "PR #$aberto já está aberto para esta branch: o commit novo entrou nele."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: atualiza o quadro do cronograma" \
            --body-file .github/quadro-corpo-de-pr.md
