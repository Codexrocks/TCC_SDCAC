name: Sincroniza GitBook

# Duas branches, dois regimes — porque os dois espaços do GitBook têm papéis
# diferentes. Contexto completo em docs/configuracao.md, seção 7.
#
#   docs/    espaço "Documentação" — SÓ LEITURA
#            main ──espelho forçado──> gitbook/docs/documentacao
#            O que o GitBook escrever ali é descartado.
#
#   artigo/  espaço "Artigo" — LEITURA E ESCRITA
#            main ──merge──> gitbook/docs/artigo ──Pull Request──> main
#            É onde a equipe redige.
#
# Por que a documentação é só leitura: o GitBook normaliza o Markdown ao
# exportar, e isso não é configurável — é comportamento documentado do produto
# ("GitBook is opinionated... will only use one"). Na primeira sincronização ele
# reescreveu 11 arquivos, −982 linhas: desfez as quebras de linha, apagou os
# comentários do gitbook-docs.yaml e duplicou o índice de relatórios. E desfaz
# qualquer correção manual "at the next opportunity".
#
# No artigo isso é aceitável: o que importa ali é o texto, e a reformatação não
# sai da pasta — espaços do GitBook são limitados ao diretório que recebem.
#
# Push feito com o GITHUB_TOKEN não dispara workflows de `push`, então não há
# laço aqui. Mas, se houver PR do artigo aberto, o push do `espelhar` cria os
# runs de `pull_request` dele — Validação, Governança e Revisor —, e esses
# ficam esperando alguém aprovar. Detalhe em revisor.yml.

on:
  push:
    branches:
      - main
      - gitbook/docs/artigo
  workflow_dispatch:

env:
  BRANCH_DOCS: gitbook/docs/documentacao
  BRANCH_ARTIGO: gitbook/docs/artigo

jobs:
  # -------------------------------------------------------------------------
  # main -> as duas branches
  # -------------------------------------------------------------------------
  espelhar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Espelhar a main na branch da documentação
        run: |
          # --force de propósito: esta branch é espelho, não fonte.
          descartados=$(git rev-list --count "origin/main..origin/$BRANCH_DOCS" 2>/dev/null || echo 0)
          if [ "$descartados" != "0" ]; then
            echo "::warning::Descartando $descartados commit(s) que o GitBook escreveu em $BRANCH_DOCS. Esperado: a branch é espelho, e edição feita no site não volta para o repositório."
          fi
          git push --force origin "origin/main:refs/heads/$BRANCH_DOCS"
          echo "Branch da documentação espelha a main."

      - name: Levar a main para a branch do artigo
        run: |
          # Aqui NAO se força: o que o GitBook escreveu é o texto do artigo, e
          # precisa sobreviver para virar Pull Request.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --heads origin "$BRANCH_ARTIGO" >/dev/null 2>&1; then
            git push origin "origin/main:refs/heads/$BRANCH_ARTIGO"
            echo "Branch do artigo criada a partir da main."
            exit 0
          fi

          git checkout -B "$BRANCH_ARTIGO" "origin/$BRANCH_ARTIGO"
          if git merge origin/main --no-edit -m "chore: traz a main para a branch do artigo"; then
            git push origin "$BRANCH_ARTIGO"
            echo "Branch do artigo atualizada."
          else
            git merge --abort
            echo "::error::Conflito entre a main e $BRANCH_ARTIGO. O mesmo trecho de artigo/ foi mexido nos dois lados — e o artigo só se escreve pelo GitBook, então isso indica edição pelo GitHub."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # branch do artigo -> Pull Request para a main
  # -------------------------------------------------------------------------
  abre-pr-do-artigo:
    if: github.ref == 'refs/heads/gitbook/docs/artigo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abrir o PR, se houver texto novo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O QUE ESTE PASSO DECIDE
          #
          # Duas perguntas, e as duas são sobre a mesma coisa: se esta branch
          # entrasse na main agora, o que mudaria na main?
          #
          #   1. Muda alguma coisa em artigo/?   Não: nada a levar.
          #   2. Muda alguma coisa fora dele?     Sim: a guarda barra.
          #
          # `git merge-tree --write-tree` calcula esse merge sem tocar em branch
          # nenhuma e devolve a árvore resultante. Comparar a main com ela é ver
          # exatamente o que o merge traria — nem mais, nem menos.
          #
          # POR QUE NÃO COMPARAR AS BRANCHES DIRETO
          #
          # Foi o que se fez antes, e cada forma errou de um jeito:
          #
          #   git log main..branch  Contava commits, e a branch está sempre à
          #                         frente: o `espelhar` empurra um merge a cada
          #                         merge na main. Todo push abria PR vazio
          #                         (PR #16, 06/09/2026).
          #   main..branch          Compara as pontas. O que a main ganhou e a
          #                         branch ainda não recebeu virava "arquivo de
          #                         fora": barrou a Introdução por um workflow
          #                         que ninguém tocou ali (08/09/2026).
          #   main...branch         Compara desde o merge-base. Só que o PR do
          #                         artigo entra por squash, que não liga o
          #                         histórico: logo depois do merge, o texto já
          #                         mergeado voltava a parecer novo, até o
          #                         `espelhar` trazer a main. E arquivo que a
          #                         branch devolveu idêntico ao da main seguia
          #                         acusado como "de fora".
          #
          # O merge calculado não cai em nenhum dos três: o que já está na main,
          # por qualquer caminho, não muda nada ao entrar de novo.
          saida=$(git merge-tree --write-tree --no-messages --name-only \
            origin/main "origin/$BRANCH_ARTIGO") && rc=0 || rc=$?
          case "$rc" in
            0)
              arvore=$saida
              ;;
            1)
              echo "::error::A branch $BRANCH_ARTIGO conflita com a main nestes arquivos:"
              printf '%s\n' "$saida" | tail -n +2
              echo "::error::O mesmo trecho foi mexido nos dois lados. O artigo só se escreve pelo GitBook — edição de artigo/ pelo GitHub provoca isto."
              exit 1
              ;;
            *)
              # Inclui a branch sem ancestral comum com a main. Erro aqui não pode
              # virar "nada a levar" nem "guarda passou": sem o merge calculado,
              # nada foi conferido.
              echo "::error::Não foi possível calcular o merge de $BRANCH_ARTIGO na main (git merge-tree saiu com $rc)."
              exit 1
              ;;
          esac

          if git diff --quiet origin/main "$arvore" -- artigo/; then
            echo "Levar esta branch para a main não mudaria nada em artigo/. Nada a levar."
            exit 0
          fi

          # Só o artigo pode vir por este caminho. Arquivo fora de artigo/ é
          # sinal de espaço do GitBook mal configurado — e a documentação
          # técnica não pode entrar reformatada pela porta do artigo.
          #
          # Três detalhes desta linha, cada um já custou uma falha:
          #
          #   --no-renames     Com detecção de rename, arquivo MOVIDO de docs/
          #                    para artigo/ aparece só com o destino, e a guarda
          #                    não via que o PR apagava o original.
          #   :(exclude)       Quem filtra é o git, não um grep na saída. O git
          #                    põe entre aspas caminho com acento, e o antigo
          #                    `grep -v '^artigo/'` tomava uma figura de artigo/
          #                    com "às" no nome por arquivo de fora.
          #   sem pipe         O antigo `| grep ... || true` engolia erro do git
          #                    e deixava a lista vazia: guarda passando sem ter
          #                    conferido nada. Sem pipe, erro do git derruba o
          #                    passo.
          fora=$(git -c core.quotePath=false diff --name-only --no-renames \
            origin/main "$arvore" -- . ':(exclude)artigo/')
          if [ -n "$fora" ]; then
            echo "::error::A branch do artigo traz arquivos fora de artigo/:"
            echo "$fora"
            echo "::error::O espaço do GitBook deveria estar limitado a ./artigo. Confira gitbook-docs.yaml e o Git Sync."
            exit 1
          fi

          aberto=$(gh pr list --base main --head "$BRANCH_ARTIGO" --state open --json number --jq '.[].number')
          if [ -n "$aberto" ]; then
            echo "Já existe o PR #$aberto; o texto novo entra nele."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH_ARTIGO" \
            --title "docs: texto do artigo escrito no GitBook" \
            --body-file .github/artigo-sync-pr.md
