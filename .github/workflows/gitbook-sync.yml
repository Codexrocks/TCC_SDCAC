name: Sincroniza GitBook

# Mão única: a `main` alimenta a branch que o GitBook lê. Nada volta.
#
#   main  ──────>  gitbook/docs/documentacao  ──────>  GitBook lê e publica
#
# Por que não é de mão dupla, já que o Git Sync do GitBook é:
#
# O GitBook normaliza o Markdown ao exportar, e isso não é configurável — é
# comportamento documentado do produto ("GitBook is opinionated. If there are
# different ways to express the same concept in markdown, GitBook will only use
# one"). Na primeira sincronização ele reescreveu 11 arquivos, −982 linhas:
# desfez as quebras de linha, trocou `---` por `***`, apagou os comentários do
# gitbook-docs.yaml e duplicou o índice de relatórios. E a documentação deles é
# explícita em que ele desfaz qualquer correção "at the next opportunity".
#
# Somado a isso, os commits dele nunca passariam no `validar.py`: não seguem
# `tipo: descrição` nem trazem `Assistido-por:`.
#
# Então a branch é um **espelho descartável**. O que o GitBook escrever nela é
# sobrescrito na próxima sincronização, sem dó. Quem quiser mudar a
# documentação faz isso pelo GitHub, por Pull Request, como todo o resto.
#
# Contexto completo em docs/configuracao.md, seção 7.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BRANCH_GITBOOK: gitbook/docs/documentacao

jobs:
  espelhar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Espelhar a main na branch do GitBook
        run: |
          # --force de propósito: a branch é espelho, não fonte. Se o GitBook
          # escreveu alguma coisa nela, é reformatação nossa de volta — e é
          # exatamente isso que não queremos na main.
          if git diff --quiet "origin/$BRANCH_GITBOOK" origin/main 2>/dev/null; then
            echo "A branch do GitBook já está idêntica à main. Nada a fazer."
            exit 0
          fi

          descartados=$(git rev-list --count "origin/main..origin/$BRANCH_GITBOOK" 2>/dev/null || echo 0)
          if [ "$descartados" != "0" ]; then
            echo "::warning::Descartando $descartados commit(s) que o GitBook escreveu na branch. Isso é esperado: a branch é espelho da main, e edição feita pelo site do GitBook não volta para o repositório."
          fi

          git push --force origin "origin/main:refs/heads/$BRANCH_GITBOOK"
          echo "Branch do GitBook agora espelha a main."
