name: Claude

# Aciona o assistente quando alguém escreve "@claude" numa issue,
# num comentário ou numa revisão de Pull Request.
#
# Requer UM destes secrets em Settings -> Secrets and variables -> Actions:
#   CLAUDE_CODE_OAUTH_TOKEN  gerado com `claude setup-token` (assinatura Pro/Max)
#   ANTHROPIC_API_KEY        chave da API, cobrada por uso
# Basta um. Se os dois existirem, o OAuth tem prioridade.
# Passo a passo em docs/configuracao.md

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Você é o assistente do TCC_SDCAC.
            Responda sempre em português do Brasil.
            Siga as regras de CONTRIBUTING.md e docs/processo.md.
            Toda página nova em docs/ precisa ser adicionada ao docs/SUMMARY.md.
            Nunca faça commit direto na main — sempre abra um Pull Request.
